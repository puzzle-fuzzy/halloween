# halloween-cloud nginx 片段
# 放入服务器已有 server{443} 域名配置块内；DOMAIN/证书沿用现有配置
# 部署时把 DATA_ROOT 替换为实际目录（与 systemd 的 DATA_ROOT 一致）

# ---- API 反代 ----
location /api/ {
    proxy_pass http://127.0.0.1:3690;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;          # 上传大小不限
    proxy_request_buffering off;     # 上传流式直通后端
    proxy_read_timeout 300s;
}

# ---- /f/ 文件直出（nginx 下发 + 子请求鉴权）----
location = /_hcloud_auth {
    internal;
    proxy_pass http://127.0.0.1:3690/api/check?$is_args$args;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

location /f/ {
    alias /srv/halloween-cloud/;     # = DATA_ROOT，注意结尾斜杠
    auth_request /_hcloud_auth;
    add_header Cache-Control "private, max-age=0";
    add_header Accept-Ranges bytes;
}
