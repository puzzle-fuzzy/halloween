# halloween.yxswy.com — all halloween services share this domain, one prefix per service
# cloud drive = /cloud (API + file delivery)
# 部署时：证书由 certbot 签发（见下方 80 段）；DATA_ROOT 与 systemd 一致；改完 nginx -t && systemctl reload nginx

server {
    listen 443 ssl;
    http2 on;
    server_name halloween.yxswy.com;

    ssl_certificate     /etc/letsencrypt/live/halloween.yxswy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/halloween.yxswy.com/privkey.pem;

    # ---- oss API（同后端，签名与元数据；文件流量直连 OSS 不过此服务器）----
    location /oss/ {
        proxy_pass http://127.0.0.1:3690;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ---- cloud API（不带回 URI，保留 /cloud 前缀由后端处理）----
    location /cloud/api/ {
        proxy_pass http://127.0.0.1:3690;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 0;          # uploads unlimited
        proxy_request_buffering off;     # stream uploads straight to backend
        proxy_read_timeout 300s;
    }

    # ---- cloud file delivery（nginx 直出 + 子请求鉴权）----
    location = /cloud/_auth {
        internal;
        proxy_pass http://127.0.0.1:3690/cloud/api/check?$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location /cloud/f/ {
        alias /srv/halloween-cloud/;     # = DATA_ROOT，注意结尾斜杠
        auth_request /cloud/_auth;
        add_header Cache-Control "private, max-age=0";
    }
}

server {
    listen 80;
    server_name halloween.yxswy.com;

    # certbot webroot 续签
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
