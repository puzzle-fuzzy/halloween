# Included by nginx's http block. Replace domain, certificate and DATA_ROOT paths.
server {
    listen 443 ssl;
    http2 on;
    server_name halloween.yxswy.com;
    ssl_certificate /etc/letsencrypt/live/halloween.yxswy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/halloween.yxswy.com/privkey.pem;

    location = /admin { return 301 /admin/; }
    location /admin/ {
        proxy_pass http://127.0.0.1:3690;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
    location /oss/ {
        proxy_pass http://127.0.0.1:3690;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s; # server-side directory/multipart copies can take time
    }
    location /cloud/api/ {
        proxy_pass http://127.0.0.1:3690;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location = /cloud/_auth {
        internal;
        proxy_pass http://127.0.0.1:3690/cloud/api/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
    # nginx normalizes escaped path components before location matching.
    location ~ ^/cloud/f/(?:.*/)?\. { return 404; }
    location /cloud/f/ {
        # Stream through Bun so symlink/path checks and private file permissions
        # have one owner. The backend handles GET Range and HEAD requests.
        proxy_pass http://127.0.0.1:3690;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Do not log tickets or legacy token query strings.
        access_log off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name halloween.yxswy.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
